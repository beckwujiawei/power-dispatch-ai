<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电力通信调度智能助手</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f3f6fa;color:#1f2937}.header{height:64px;background:#123b68;color:#fff;display:flex;align-items:center;padding:0 28px;font-size:21px;font-weight:bold}.container{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;padding:18px}.panel{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px #00000014;overflow:auto}.panel h2{margin:0 0 12px;font-size:18px;border-bottom:1px solid #e5e7eb;padding-bottom:12px}.filters,.report-actions{display:grid;gap:8px;margin-bottom:12px}select,input{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:10px;font-size:14px;background:#fff}button{border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:#fff;background:#2563eb;font-size:14px}button:hover{background:#1d4ed8}button.secondary{background:#64748b}.button-row{display:flex;gap:8px}.button-row>*{flex:1}.status{color:#64748b;font-size:13px;margin:8px 0}.alert{border-left:4px solid #dc2626;background:#fff7ed;margin:10px 0;padding:10px;border-radius:5px}.alert-title{font-weight:bold;color:#991b1b}.tag,.ticket-status{display:inline-block;padding:3px 7px;border-radius:4px;font-size:12px;background:#fee2e2;color:#991b1b}.chat-box{height:360px;overflow:auto;padding:8px;background:#f8fafc;border-radius:8px}.message{margin:10px 0;padding:10px 12px;border-radius:8px;line-height:1.6;white-space:pre-wrap}.user{background:#dbeafe;margin-left:30px}.assistant{background:#ecfdf5;margin-right:30px}.input-area{display:flex;gap:8px;margin-top:12px}.input-area input{flex:1}.action{background:#eff6ff;margin:8px 0;padding:9px;border-radius:6px}.ticket,.report{background:#fefce8;border:1px solid #fde68a;padding:12px;border-radius:6px;line-height:1.7}.report{background:#eff6ff;border-color:#bfdbfe}.ticket-item,.audit-item{border:1px solid #e2e8f0;border-left:4px solid #2563eb;border-radius:6px;padding:10px;margin:10px 0;background:#f8fafc}.ticket-item{border-left-color:#d97706}.audit-meta{color:#64748b;font-size:12px;margin-bottom:6px}.audit-action{color:#1e40af;font-weight:bold}.audit-content{white-space:pre-wrap;line-height:1.5;max-height:130px;overflow:auto;font-size:13px}.empty,.error{padding:16px;text-align:center;background:#f8fafc;color:#64748b;border-radius:6px}.error{color:#b91c1c;background:#fef2f2}.wide{grid-column:1/-1}@media(max-width:1100px){.container{grid-template-columns:1fr 1.2fr}.wide{grid-column:1/-1}}@media(max-width:900px){.container{grid-template-columns:1fr}.wide{grid-column:auto}.input-area{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="header">电力通信调度智能助手</div>
<div class="container">
<section class="panel"><h2>通信告警</h2><div class="filters"><select id="station"><option value="">全部站点</option></select><select id="level"><option value="">全部等级</option><option>严重</option><option>重要</option><option>一般</option></select><select id="alertStatus"><option value="">全部状态</option><option>未恢复</option><option>已恢复</option></select><div class="button-row"><button onclick="loadAlerts()">查询告警</button><button class="secondary" onclick="resetAlerts()">重置</button></div></div><div id="alertSummary" class="status"></div><div id="alerts"></div></section>
<section class="panel"><h2>智能调度对话</h2><div id="chat" class="chat-box"><div class="message assistant">你好，我是电力通信调度智能助手。你可以问我：\n\n1. 分析当前通信告警\n2. 生成一个故障工单\n3. 生成交接班报告</div></div><div class="input-area"><input id="message" placeholder="请输入调度问题"><button onclick="sendMessage()">发送</button></div><div id="status" class="status">当前为演示模式。</div></section>
<section class="panel"><h2>分析结果</h2><div id="analysis">暂无分析结果</div></section>
<section class="panel wide"><div class="button-row"><h2 style="flex:1">交接班报告</h2><button onclick="loadReport()">生成报告</button><button onclick="copyReport()">复制报告</button></div><div id="report" class="report"><div class="empty">点击“生成报告”查看当前交接班摘要。</div></div></section>
<section class="panel"><div class="button-row"><h2 style="flex:1">工单管理</h2><button onclick="loadTickets()">刷新</button></div><div class="button-row"><select id="ticketStatus"><option value="">全部状态</option><option>待确认</option><option>已确认</option><option>处理中</option><option>已关闭</option></select><button onclick="loadTickets()">查询</button></div><div id="ticketSummary" class="status"></div><div id="tickets"></div></section>
<section class="panel"><div class="button-row"><h2 style="flex:1">审计记录</h2><button onclick="loadAudit()">刷新</button></div><div id="auditSummary" class="status"></div><div id="audit"></div></section>
</div>
<script>
const $=id=>document.getElementById(id), state={reportText:''};
async function loadAlerts(){const p=new URLSearchParams();if($('station').value)p.set('station',$('station').value);if($('level').value)p.set('level',$('level').value);if($('alertStatus').value)p.set('status',$('alertStatus').value);try{const d=await(await fetch('/api/alerts?'+p)).json();$('alertSummary').textContent=`当前显示 ${d.total} 条告警`;$('alerts').innerHTML=d.items.length?'':'<div class="empty">没有符合条件的告警。</div>';d.items.forEach(a=>$('alerts').innerHTML+=`<div class="alert"><div class="alert-title">${a.station} - ${a.device}</div><div>${a.description}</div><div>类型：${a.alert_type}　时间：${a.occurred_at}</div><span class="tag">${a.level} / ${a.status}</span></div>`);if(!$('station').dataset.loaded){const all=await(await fetch('/api/alerts')).json();[...new Set(all.items.map(a=>a.station))].forEach(s=>$('station').innerHTML+=`<option value="${s}">${s}</option>`);$('station').dataset.loaded='1'}}catch(e){$('alerts').innerHTML='<div class="error">告警加载失败。</div>'}}
function resetAlerts(){$('station').value='';$('level').value='';$('alertStatus').value='';loadAlerts()}
function addMessage(type,text){$('chat').innerHTML+=`<div class="message ${type}">${text}</div>`;$('chat').scrollTop=$('chat').scrollHeight}
function renderResult(r){let h=`<p><strong>识别意图：</strong>${r.intent}</p><p>${r.answer}</p>`;(r.recommended_actions||[]).forEach(a=>h+=`<div class="action">${a}</div>`);if(r.ticket_draft){const t=r.ticket_draft;h+=`<div class="ticket"><strong>${t.title}</strong><br>优先级：${t.priority}<br>站点：${t.station}<br>设备：${t.related_device}<br>描述：${t.description}<br><button onclick='createTicket(${JSON.stringify(t)})'>确认并创建工单</button></div>`}$('analysis').innerHTML=h}
async function sendMessage(){const m=$('message').value.trim();if(!m)return;addMessage('user',m);$('message').value='';try{const r=await(await fetch('/api/dispatch/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,session_id:'demo-session'})})).json();addMessage('assistant',r.answer);renderResult(r)}catch(e){$('status').textContent='服务调用失败'}}
async function createTicket(t){const r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...t,operator:'演示调度员'})});if(r.ok){$('status').textContent='工单已创建';loadTickets();loadAudit()}else $('status').textContent='工单创建失败'}
async function loadTickets(){const s=$('ticketStatus').value;const d=await(await fetch('/api/tickets'+(s?'?status='+encodeURIComponent(s):''))).json();$('ticketSummary').textContent=`共 ${d.total} 条工单`;$('tickets').innerHTML=d.items.length?'':'<div class="empty">暂无工单。</div>';d.items.forEach(t=>$('tickets').innerHTML+=`<div class="ticket-item"><b>${t.id} · ${t.title}</b><br>优先级：${t.priority}　站点：${t.station}<br><span class="ticket-status">${t.status}</span><br><select onchange="changeTicket('${t.id}',this.value)"><option value="">更新状态</option><option>待确认</option><option>已确认</option><option>处理中</option><option>已关闭</option></select></div>`)}
async function changeTicket(id,status){if(!status)return;await fetch('/api/tickets/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,operator:'演示调度员'})});loadTickets();loadAudit()}
async function loadAudit(){const d=await(await fetch('/api/audit/logs')).json(),items=[...(d.items||[])].reverse();$('auditSummary').textContent=`共 ${items.length} 条记录`;$('audit').innerHTML=items.length?'':'<div class="empty">暂无审计记录。</div>';items.forEach(i=>$('audit').innerHTML+=`<div class="audit-item"><div class="audit-meta">${i.created_at||''} · ${i.operator||''}</div><div class="audit-action">${i.action||''}</div><div class="audit-content">${i.content||''}</div></div>`)}
async function loadReport(){try{const d=await(await fetch('/api/reports/handover')).json();state.reportText=`${d.title}\n生成时间：${d.generated_at}\n${d.summary}\n\n告警：${d.alerts.map(a=>`${a.station} - ${a.device}：${a.description}`).join('\n')}\n\n工单：${d.tickets.map(t=>`${t.id} - ${t.title}（${t.status}）`).join('\n')}\n\n建议：\n${d.recommendations.join('\n')}`;$('report').innerHTML=`<b>${d.title}</b><br>生成时间：${d.generated_at}<p>${d.summary}</p><b>统计</b><p>告警 ${d.statistics.total_alerts} 条，其中未恢复 ${d.statistics.unresolved_alerts} 条、严重 ${d.statistics.severe_alerts} 条；未关闭工单 ${d.statistics.open_tickets} 条。</p><b>交接建议</b><ul>${d.recommendations.map(x=>`<li>${x}</li>`).join('')}</ul>`}catch(e){$('report').innerHTML='<div class="error">报告生成失败，请检查后端服务。</div>'}}
async function copyReport(){if(!state.reportText)await loadReport();if(state.reportText)await navigator.clipboard.writeText(state.reportText);$('status').textContent='交接班报告已复制'}
$('message').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});loadAlerts();loadTickets();loadAudit();
</script>
</body></html>
